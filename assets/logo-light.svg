<svg viewBox="0 0 232 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kamobo">
  <!-- Flat mark, no gradient. The glyph is a stem with two branches: one node
       solved (accent), one still open. Reads as infrastructure, not a sparkle. -->
  <rect x="0" y="4" width="48" height="48" rx="6" fill="#FFFFFF" fill-opacity="0.10"/>
  <g stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" fill="none">
    <line x1="17" y1="16" x2="17" y2="40"/>
    <path d="M17 28 L31 16.5"/>
    <path d="M17 28 L31 39.5"/>
  </g>
  <circle cx="17" cy="28" r="3.8" fill="#FFFFFF"/>
  <circle cx="31" cy="16.5" r="3.4" fill="#2FB389"/>
  <circle cx="31" cy="39.5" r="3.4" fill="#FFFFFF"/>
  <text x="62" y="37" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="27" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF">Kamobo</text>
</svg>
