<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kamobo social card source</title>
<!--
  Source for assets/og-card.png (1200x630), rebuilt 6 November 2026: flat navy,
  IBM Plex Sans, the homepage headline.

  To regenerate with Edge headless (body margin is 0, so the card fills the shot):

      msedge --headless=new --window-size=1200,630 --virtual-time-budget=4000
        --screenshot=assets/og-card.png assets/og-card.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #555; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #0C1F2C; color: #fff;
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .inner { position: relative; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark { width: 54px; height: 54px; border-radius: 7px; background: rgba(255,255,255,0.1); position: relative; }
  .mark svg { position: absolute; inset: 0; }
  .word { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; }
  h1 { font-size: 62px; line-height: 1.1; letter-spacing: -1.6px; font-weight: 700; margin: 0 0 22px; max-width: 17ch; }
  p { font-size: 23px; line-height: 1.5; color: rgba(255,255,255,0.72); margin: 0; max-width: 54ch; }
  .foot { display: flex; align-items: center; gap: 14px; font-size: 18px; color: rgba(255,255,255,0.56); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2FB389; }
  .sub { display: block; margin-top: 14px; font-size: 38px; font-weight: 500; letter-spacing: -0.8px; color: #34B88F; }
  .rule { height: 3px; width: 72px; background: #2FB389; margin: 0 0 30px; border-radius: 2px; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="inner brand">
      <div class="mark">
        <svg viewBox="0 0 54 54" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" fill="none">
            <line x1="18" y1="16" x2="18" y2="38"/>
            <path d="M18 27 L34 16"/>
            <path d="M18 27 L34 38"/>
          </g>
          <circle cx="18" cy="27" r="4" fill="#FFFFFF"/>
          <circle cx="34" cy="16" r="3.6" fill="#2FB389"/>
          <circle cx="34" cy="38" r="3.6" fill="#FFFFFF"/>
        </svg>
      </div>
      <span class="word">Kamobo</span>
    </div>
    <div class="inner">
      <div class="rule"></div>
      <h1>UK-based Azure consultancy.<span class="sub">Platform engineering, AI and data platforms.</span></h1>
      <p>Built as code, in your own tenant. Led hands-on by the engineer doing the work.</p>
    </div>
    <div class="inner foot">
      <span class="dot"></span>
      <span>kamobo.co.uk</span>
    </div>
  </div>
</body>
</html>
